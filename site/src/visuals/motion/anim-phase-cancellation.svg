.pc .hi{fill:var(--ulm-accent,#E03B3B)}
@keyframes pc-slide{0%{transform:translateX(0)}50%{transform:translateX(100.0px)}100%{transform:translateX(0)}}
@keyframes pc-sum{0.0%{transform:scaleY(1.0000)}
5.0%{transform:scaleY(0.9877)}
10.0%{transform:scaleY(0.9511)}
