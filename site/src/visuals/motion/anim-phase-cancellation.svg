<svg class="pc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" fill="none" role="img" aria-label="Phase cancellation: as one copy shifts by half a wavelength the summed signal collapses">
<title>Phase cancellation</title>
<style>
