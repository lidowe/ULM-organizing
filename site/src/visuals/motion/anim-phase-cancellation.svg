100.0%{transform:scaleY(1.0000)}}
@keyframes pc-marker{0%{transform:translateX(0)}50%{transform:translateX(120px)}100%{transform:translateX(0)}}
@keyframes pc-null{0%,38%{opacity:0}50%{opacity:1}62%,100%{opacity:0}}
.pc-b{animation:pc-slide 8s ease-in-out infinite}
.pc-sum{transform-box:view-box;transform-origin:240px 226px;animation:pc-sum 8s ease-in-out infinite}
.pc-marker{animation:pc-marker 8s ease-in-out infinite}
.pc-null{animation:pc-null 8s ease-in-out infinite;opacity:0}
@media (prefers-reduced-motion: reduce){
.pc-b,.pc-sum,.pc-marker{animation:none!important}
.pc-sum{transform:scaleY(0.5)!important}
.pc-null{animation:none!important;opacity:0}
}
</style>
